<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ludofolio — browser games</title>
  <meta name="description" content="Ludofolio — short original browser games. First release: Mood Rush." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --ink: #eef3fb;
      --muted: #8b9bb8;
      --accent: #5ad0c8;
      --warn: #f0c14a;
      --line: #243148;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Zen Kaku Gothic New", "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, #1a3a58 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 80%, #2a1838 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 0% 60%, #102830 0%, transparent 45%),
        var(--bg);
      min-height: 100dvh;
    }
    .noise {
      pointer-events: none;
      position: fixed; inset: 0; opacity: 0.035; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .shell {
      position: relative; z-index: 1;
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .lang {
      display: flex; gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      background: #0c1220aa;
    }
    .lang button {
      border: 0; background: transparent; color: var(--muted);
      font-family: "Outfit", sans-serif; font-weight: 700; font-size: 11px;
      padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .lang button.on { background: #1c2a44; color: #fff; }
    .hero {
      flex: 1;
      display: grid;
      align-content: center;
      gap: 28px;
      padding: 48px 0 24px;
    }
    .brand {
      font-family: "Outfit", sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 12vw, 92px);
      letter-spacing: 0.02em;
      line-height: 0.95;
      background: linear-gradient(180deg, #ffffff 20%, #8fd9d3 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 0.9s ease both;
    }
    .brand span {
      display: block;
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-size: 0.22em;
      letter-spacing: 0.28em;
      color: var(--accent);
      margin-top: 14px;
      font-weight: 700;
      -webkit-text-fill-color: var(--accent);
    }
    .lead {
      max-width: 28em;
      font-size: clamp(15px, 2.4vw, 18px);
      line-height: 1.7;
      color: var(--muted);
      animation: rise 0.9s ease 0.08s both;
    }
    .cta {
      display: flex; flex-wrap: wrap; gap: 12px;
      animation: rise 0.9s ease 0.16s both;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-main {
      color: #061018;
      background: linear-gradient(180deg, #ffe08a, #f0c14a);
      box-shadow: 0 12px 32px #f0c14a33;
    }
    .btn-ghost {
      color: var(--ink);
      border: 1px solid var(--line);
      background: #0c122066;
    }
    .stage {
      margin-top: 8px;
      border-top: 1px solid #1a2740;
      padding-top: 28px;
      animation: rise 0.9s ease 0.24s both;
    }
    .stage h2 {
      font-family: "Outfit", sans-serif;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 14px;
    }
    .game {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 18px;
      align-items: stretch;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(135deg, #122038 0%, #0c1528 55%, #1a1228 100%);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .game:hover {
      border-color: #3a6a78;
      transform: translateY(-2px);
    }
    .preview {
      min-height: 180px;
      position: relative;
      background:
        radial-gradient(circle at 50% 70%, #5ad0c844, transparent 40%),
        linear-gradient(180deg, #152038, #0a101c);
      display: grid;
      place-items: center;
    }
    .orb {
      width: 54px; height: 54px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #5ad0c8 45%, #2a7a74);
      box-shadow: 0 0 40px #5ad0c866;
      animation: float 2.8s ease-in-out infinite;
    }
    .gate {
      position: absolute;
      height: 14px; width: 38%;
      border-radius: 6px;
      background: linear-gradient(180deg, #7adfd6, #2a7a84);
      opacity: 0.85;
    }
    .gate.a { top: 28%; left: 8%; animation: fall 2.4s linear infinite; }
    .gate.b { top: 12%; right: 10%; width: 30%; background: linear-gradient(180deg, #ff6b5a, #a82828); animation: fall 2.4s linear 0.8s infinite; }
    .meta { padding: 22px 22px 24px; display: grid; align-content: center; gap: 10px; }
    .meta .tag {
      font-family: "Outfit", sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--accent);
      font-weight: 700;
    }
    .meta h3 {
      font-family: "Outfit", sans-serif;
      font-size: 28px;
      font-weight: 800;
    }
    .meta h3 small {
      display: block;
      margin-top: 4px;
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .meta p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .foot {
      margin-top: auto;
      padding-top: 36px;
      color: #667790;
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fall {
      from { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.85; }
      to { transform: translateY(110px); opacity: 0; }
    }
    @media (max-width: 700px) {
      .game { grid-template-columns: 1fr; }
      .preview { min-height: 150px; }
      .hero { padding-top: 36px; }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="shell">
    <div class="nav">
      <div aria-hidden="true"></div>
      <div class="lang" aria-label="language">
        <button type="button" data-lang="ja" class="on">JA</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>

    <header class="hero">
      <h1 class="brand">Ludofolio<span id="brandSub">遊びの作品集</span></h1>
      <p class="lead" id="lead">短いオリジナルゲームを並べる場所。まずは感情が難易度になる一本から。</p>
      <div class="cta">
        <a class="btn btn-main" href="games/mood-rush.html" id="ctaPlay">Mood Rush を遊ぶ</a>
        <a class="btn btn-ghost" href="#now" id="ctaMore">公開中の作品</a>
      </div>
    </header>

    <section class="stage" id="now">
      <h2 id="nowLabel">公開中</h2>
      <a class="game" href="games/mood-rush.html">
        <div class="preview" aria-hidden="true">
          <div class="gate a"></div>
          <div class="gate b"></div>
          <div class="orb"></div>
        </div>
        <div class="meta">
          <div class="tag">ORIGINAL · SHORT RUN</div>
          <h3>Mood Rush<small id="gameSub">きぶんラン</small></h3>
          <p id="gameDesc">焦るほど道が狭くなる。深呼吸で落ち着いて、ベストを抜け。</p>
        </div>
      </a>
    </section>

    <footer class="foot" id="foot">© Ludofolio · original games only</footer>
  </div>

  <script>
    const I18N = {
      ja: {
        brandSub: "遊びの作品集",
        lead: "短いオリジナルゲームを並べる場所。まずは感情が難易度になる一本から。",
        ctaPlay: "Mood Rush を遊ぶ",
        ctaMore: "公開中の作品",
        nowLabel: "公開中",
        gameSub: "きぶんラン",
        gameDesc: "焦るほど道が狭くなる。深呼吸で落ち着いて、ベストを抜け。",
        foot: "© Ludofolio · オリジナルのみ掲載",
      },
      en: {
        brandSub: "A FOLIO OF PLAY",
        lead: "A shelf for short original browser games. First up: difficulty driven by your mood.",
        ctaPlay: "Play Mood Rush",
        ctaMore: "Now playing",
        nowLabel: "NOW PLAYING",
        gameSub: "MOOD RUN",
        gameDesc: "Panic shrinks the path. Breathe, weave near-misses, beat your best.",
        foot: "© Ludofolio · original games only",
      },
    };
    let lang = localStorage.getItem("ludofolio_lang") || localStorage.getItem("moodrush_lang") || localStorage.getItem("pulselab_lang") || "ja";
    function apply() {
      const t = I18N[lang] || I18N.ja;
      document.documentElement.lang = lang;
      brandSub.textContent = t.brandSub;
      lead.textContent = t.lead;
      ctaPlay.textContent = t.ctaPlay;
      ctaMore.textContent = t.ctaMore;
      nowLabel.textContent = t.nowLabel;
      gameSub.textContent = t.gameSub;
      gameDesc.textContent = t.gameDesc;
      foot.textContent = t.foot;
      document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
    }
    document.querySelectorAll(".lang button").forEach((btn) => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        localStorage.setItem("ludofolio_lang", lang);
        localStorage.setItem("moodrush_lang", lang);
        apply();
      });
    });
    apply();
  </script>
</body>
</html>
